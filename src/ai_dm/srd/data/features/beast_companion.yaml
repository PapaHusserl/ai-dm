id: beast_companion
name: Зверь-спутник
description: С героем связан зверь Среднего размера или меньше (имя, вид и заметки хранятся у героя). Вне боя он разведывает местность, идёт по следу, сторожит стоянку и понимает простые команды. В бою зверь пока не участвует. Если зверь погиб, герой может связать с собой нового после одной ночи обряда у костра в диком месте.
