id: second_wind
name: Второе дыхание
description: Бонусным действием вы восстанавливаете 1d10 + уровень воина хит-пойнтов. Два использования (три с 4 уровня);
  одно восстанавливается после короткого отдыха, все — после продолжительного.
source: srd-5.2
license: CC-BY-4.0
effects:
