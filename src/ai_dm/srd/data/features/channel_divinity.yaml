id: channel_divinity
name: Божественный канал
description: Действием вы направляете божественную силу. Два использования (три с 6 уровня, четыре с 18); одно
  восстанавливается после короткого отдыха, все — после продолжительного. Божественная искра — цель в пределах 30 фт.
  получает 1d8 + Мудрость хит-пойнтов либо принимает столько же некротического или излучением урона (спасбросок
  Телосложения — половина). Изгнание нежити — нежить в пределах 30 фт. проходит спасбросок Мудрости или на 1 минуту
  (до урона) становится испуганной и недееспособной.
source: srd-5.2
license: CC-BY-4.0
effects:
- type: resource
  pool: channel_divinity
  max: 2
  max_by_level:
    2: 2
    6: 3
    18: 4
  recover:
  - "on": short_rest
    amount: 1
  - "on": long_rest
    amount: all
activation: action
