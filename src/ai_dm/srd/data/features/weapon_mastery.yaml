id: weapon_mastery
name: Мастерство оружия
description: Вы можете использовать свойства мастерства для нескольких видов оружия, которыми владеете.
  Количество зависит от класса (у воина растёт с уровнем — 3, с 4 уровня 4, с 10 — 5, с 16 — 6); после продолжительного
  отдыха выбор можно менять.
