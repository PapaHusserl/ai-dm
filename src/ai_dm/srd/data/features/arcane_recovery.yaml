id: arcane_recovery
name: Магическое восстановление
description: Один раз в день после короткого отдыха вы возвращаете потраченные ячейки заклинаний суммарным кругом не больше
  половины уровня волшебника (округляя вверх); ячейки 6 круга и выше вернуть нельзя. Восстанавливается после продолжительного отдыха.
source: srd-5.2
license: CC-BY-4.0
effects:
- type: resource
  pool: arcane_recovery
  max: 1
  recover:
  - "on": long_rest
    amount: all
