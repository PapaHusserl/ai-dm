id: sneak_attack
name: Скрытая атака
description: Раз в ход, попав атакой с преимуществом по цели (оружием со свойством «фехтовальное» или дальнобойным), либо по цели,
  рядом с которой есть боеспособный союзник (если у вас нет помехи), вы наносите дополнительный урон. Кости растут с уровнем плута —
  1d6 на 1 уровне, 2d6 на 3, 3d6 на 5, далее на 1d6 каждые два уровня.
