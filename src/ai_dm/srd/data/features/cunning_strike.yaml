id: cunning_strike
name: Хитрый удар
description: Когда вы наносите Скрытую атаку, вы можете отказаться от одной кости урона Скрытой атаки ради эффекта. Сбить с
  ног — цель, не крупнее Большой, проходит спасбросок Ловкости (СЛ 8 + Ловкость + бонус мастерства) или падает ничком.
  Отравить (нужен набор отравителя) — цель проходит спасбросок Телосложения или становится отравленной на 1 минуту.
  Отступить — после атаки вы перемещаетесь без провоцирования атак по возможности.
