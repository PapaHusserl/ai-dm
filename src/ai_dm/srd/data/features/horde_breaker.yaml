id: horde_breaker
name: Истребитель орд
description: 'Раз в ход, атакуя оружием, вы можете сделать ещё одну атаку тем же оружием по другому существу в пределах 5 фт. от первой цели и в дальности оружия. Движок: после атаки оружием раз в ход — пункт меню «Истребитель орд» по другой цели в зоне первой.'
