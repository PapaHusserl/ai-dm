id: detect_poison_and_disease
name: Обнаружение яда и болезней
description: "Пока держится концентрация (до 10 минут), вы чувствуете ядовитые и заразные существа, вещества и предметы в пределах 30 фт., узнаёте их вид и опасность. Тонкий слой камня, земли, металл и другие преграды скрывают источник. Ритуал."
source: srd-5.2
license: CC-BY-4.0
level: 1
school: divination
range_kind: self
duration: 10m
concentration: true
ritual: true
classes:
- cleric
effect_text: Жрец чует яды, отравленные вещи и заразных существ в 30 фт. и узнаёт их вид.
effects:
- type: utility
