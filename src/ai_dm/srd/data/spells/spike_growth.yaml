id: spike_growth
name: Шипастая поросль
description: "Земля в радиусе 20 фт. от точки в пределах 150 фт. обрастает колючками (концентрация, до 10 минут) и становится труднопроходимой. Существо, идущее по ней, получает 2d4 колющего урона за каждые 5 фт. пути. Заметить такую поросль со стороны трудно."
