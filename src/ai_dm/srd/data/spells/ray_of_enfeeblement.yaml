id: ray_of_enfeeblement
name: Луч ослабления
description: "Луч иссушающей энергии бьёт в существо в пределах 60 фт.: оно совершает спасбросок Телосложения и при провале, пока держится концентрация (до 1 минуты), вычитает 1d8 из бросков урона и совершает атаки с помехой. В конце каждого своего хода цель повторяет спасбросок."
