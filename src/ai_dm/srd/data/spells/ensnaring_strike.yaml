id: ensnaring_strike
name: Опутывающий удар
description: "Бонусным действием вы заряжаете оружие лозами (концентрация, до 1 минуты). После следующего попадания оружием цель проходит спасбросок Силы (Большая и крупнее — с преимуществом), а при провале оказывается опутана; при успехе лозы вянут и заклинание кончается. Опутанная цель в начале своего хода получает 1d6 колющего урона и может вырваться действием: проверка Силы (Атлетика) против СЛ заклинания. На каждый уровень ячейки выше 1-го урон растёт на 1d6."
source: srd-5.2
license: CC-BY-4.0
level: 1
school: conjuration
range_kind: self
casting_time: bonus_action
duration: 1m
concentration: true
classes:
- ranger
upcast:
  per_slot_level:
    dice: 1d6
effects:
- type: rider
  condition: restrained
  ability: str
  dice: 1d6
  damage_type: piercing
  when: on_weapon_hit
