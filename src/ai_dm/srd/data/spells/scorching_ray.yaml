id: scorching_ray
name: Палящий луч
description: "Три огненных луча: для каждого дальнобойная атака заклинанием по цели в пределах 120 фт., при попадании 2d6 урона огнём. Лучи можно направить в разные цели или в одну. На каждый уровень ячейки выше 2-го — ещё один луч."
