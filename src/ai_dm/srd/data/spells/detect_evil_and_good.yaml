id: detect_evil_and_good
name: Обнаружение добра и зла
description: "Пока держится концентрация (до 10 минут), вы чувствуете присутствие в пределах 30 фт. аберраций, исчадий, фей, небожителей, элементалей и нежити, а также освящённых или оскверняемых мест и предметов. Вы узнаёте тип существа и направление, но не точное место. Тонкий слой камня или земли, свинец и другие преграды скрывают источник."
source: srd-5.2
license: CC-BY-4.0
level: 1
school: divination
range_kind: self
duration: 10m
concentration: true
classes:
- cleric
effect_text: Жрец чует поблизости нежить, исчадий, фей, небожителей и освящённые места.
effects:
- type: utility
