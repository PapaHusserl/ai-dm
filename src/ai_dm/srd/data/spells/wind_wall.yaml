id: wind_wall
name: Стена ветра
description: "В выбранном месте в пределах 120 фт. встаёт стена сильного ветра длиной 50 фт. и высотой 15 фт. (концентрация, до 1 минуты). Существа в этой области совершают спасбросок Силы и при провале получают 4d8 дробящего урона, при успехе — половину. Стена останавливает стрелы, газы и туман."
source: srd-5.2
