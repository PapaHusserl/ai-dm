id: find_traps
name: Поиск ловушек
description: "Вы чувствуете присутствие ловушек в пределах 120 фт. от вас и в пределах прямой видимости: узнаёте, что ловушка есть, но не где она и как работает. Ловушкой считается всё, что наносит внезапный вред: ямы, шипы, магические руны."
source: srd-5.2
license: CC-BY-4.0
level: 2
school: divination
range_kind: ranged
range_ft: 120
classes:
- cleric
effect_text: Жрец чует ловушки в 120 фт. в зоне видимости, но не знает, где они и как сработают.
