id: create_or_destroy_water
name: Сотворение или уничтожение воды
description: "Вы создаёте до 10 галлонов чистой воды в открытой ёмкости или проливаете её дождём на куб со стороной 30 фт., либо, наоборот, уничтожаете до 10 галлонов воды или рассеиваете туман в таком же кубе. На каждый уровень ячейки выше 1-го объём растёт на 10 галлонов."
source: srd-5.2
license: CC-BY-4.0
level: 1
school: transmutation
range_kind: ranged
range_ft: 30
classes:
- cleric
effect_text: Жрец творит до десятка галлонов чистой воды или обращает такую же воду в ничто.
effects:
- type: utility
