id: dispel_magic
name: Рассеивание магии
description: "Выберите существо, предмет или магический эффект в пределах 120 фт.: все заклинания 3-го круга и ниже на нём заканчиваются. Для более высоких заклинаний совершите проверку характеристики заклинателя против СЛ 10 + круг заклинания. На каждый круг выше 3-го автоматически снимаются заклинания на круг выше."
source: srd-5.2
