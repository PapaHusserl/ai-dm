id: conjure_animals
name: Призыв животных
description: "Вокруг вас до 10 минут (концентрация) кружится стая призрачных зверей. Враг, который входит в вашу зону или заканчивает в ней ход, совершает спасбросок Ловкости: при провале получает 3d10 рубящего урона, при успехе урона не получает. На каждый уровень ячейки выше 3-го — +1d10."
