id: enlarge_reduce
name: Увеличение/уменьшение
description: "Пока держится концентрация (до 1 минуты), существо в пределах 30 фт. вырастает или уменьшается на размер. Увеличенное получает +1d4 к урону оружием и преимущество на проверки и спасброски Силы; уменьшенное — вычитает 1d4 и получает помеху. Неохотная цель совершает спасбросок Телосложения."
source: srd-5.2
license: CC-BY-4.0
level: 2
school: transmutation
range_kind: ranged
range_ft: 30
duration: 1m
concentration: true
classes:
- wizard
