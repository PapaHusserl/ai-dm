id: fear
name: Страх
description: "Вы показываете существам в конусе 30 фт. их худший кошмар: спасбросок Мудрости, при провале они становятся испуганными, пока держится концентрация (до 1 минуты), и бросают всё, что держат. Испуганное существо должно бежать; оно повторяет спасбросок в конце хода."
