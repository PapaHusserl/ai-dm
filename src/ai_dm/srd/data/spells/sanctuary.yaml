id: sanctuary
name: Святилище
description: "Бонусным действием вы охраняете существо в пределах 30 фт. на 1 минуту: монстр, выбирающий его целью атаки или вредного заклинания, сначала совершает спасбросок Мудрости и при провале выбирает другую цель или теряет действие. Охрана спадает, когда защищаемый атакует или накладывает вредное заклинание."
