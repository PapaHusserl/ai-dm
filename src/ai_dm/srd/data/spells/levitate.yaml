id: levitate
name: Левитация
description: "Существо или предмет в пределах 60 фт. весом до 500 фунтов поднимается на 20 фт. и висит в воздухе, пока держится концентрация (до 10 минут). Неохотная цель совершает спасбросок Телосложения. Цель может толкаться от опор и перемещаться на 20 фт. за ход."
source: srd-5.2
