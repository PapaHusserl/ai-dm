id: command
name: Приказ
description: "Вы произносите одно слово приказа существу в пределах 60 фт.: при провале спасброска Мудрости оно исполняет его в свой следующий ход. В игре — приказ «Ниц»: цель падает и остаётся лежать. На каждый уровень ячейки выше 1-го — ещё одна цель."
