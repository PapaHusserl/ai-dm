id: hunters_mark
name: Метка охотника
description: "Бонусным действием вы помечаете существо в пределах 90 фт.: пока держится концентрация (до 1 часа), каждое ваше попадание атакой по цели наносит ей ещё 1d6 урона силовым полем (при крите кость удваивается). Вы легче находите помеченную цель: преимущество на проверки Восприятия и Выживания для её поиска."
