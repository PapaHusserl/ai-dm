id: counterspell
name: Контрзаклинание
description: "Реакцией, когда существо в пределах 60 фт. творит заклинание, вы пытаетесь его сорвать: заклинание 3-го круга и ниже срывается автоматически, выше — проверкой характеристики заклинателя против СЛ 10 + круг. В игре противников-заклинателей пока нет."
source: srd-5.2
