id: great_weapon_fighting
name: Бой двуручным оружием
description: Когда на кости урона вашей атаки двуручным или универсальным оружием, удерживаемым двумя руками, выпадает 1 или 2, считайте, что выпало 3. Эффект в движке пока не считается.
