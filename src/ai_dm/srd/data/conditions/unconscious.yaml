id: unconscious
name: Без сознания
description: Вы недееспособны, не двигаетесь, не замечаете происходящего, роняете всё и падаете ничком.
  Автоматический провал спасбросков Силы и Ловкости. Атаки по вам с преимуществом; попадание в пределах
  5 фт. — критическое.
