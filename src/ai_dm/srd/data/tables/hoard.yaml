id: hoard
name: Клад логова (деньги) по полосам CR
source: custom
# Собственная таблица проекта (решение В4а аудита этапа 3). Числа НЕ из руководства мастера (лицензия не CC-BY),
# в SRD 5.2 таблицы клада нет. Ориентир по масштабу: клад логова примерно вдвое больше индивидуального
# сокровища (individual_treasure) за 3-5 побеждённых той же полосы: полоса 0-4 -- около 100 зм, 5-10 -- около 1000 зм.
# Формула монеты: <count>d<sides> x <mult_cp> медных. Монеты: cp, sp, gp, pp.
# Полосы по максимальному CR побеждённых (и по уровню героя без побеждённых): 0-4, 5-10, 11-16, 17+.
# Числа утверждены проектировщиком (К0б, 2026-10-11): полосы 11-16 и 17+ -- проектные, не SRD.
rows:
  '0-4:cp:count': 3
  '0-4:cp:sides': 6
  '0-4:cp:mult_cp': 100
  '0-4:sp:count': 2
  '0-4:sp:sides': 6
  '0-4:sp:mult_cp': 500
  '0-4:gp:count': 3
  '0-4:gp:sides': 6
  '0-4:gp:mult_cp': 500
  '5-10:sp:count': 2
  '5-10:sp:sides': 6
