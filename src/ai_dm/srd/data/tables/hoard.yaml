  '5-10:gp:sides': 6
  '5-10:gp:mult_cp': 5000
  '5-10:pp:count': 1
  '5-10:pp:sides': 6
  '5-10:pp:mult_cp': 10000
  '11-16:sp:count': 2
  '11-16:sp:sides': 6
  '11-16:sp:mult_cp': 20000
  '11-16:gp:count': 2
  '11-16:gp:sides': 6
  '11-16:gp:mult_cp': 100000
  '11-16:pp:count': 1
  '11-16:pp:sides': 6
  '11-16:pp:mult_cp': 100000
  '17+:gp:count': 2
