surrendered = 0
spared = 20
fled = -40
# бежавший или сдавшийся с отношением не выше этого порога мстит герою
revenge_attitude_max = -40

[disarm]
unarmed_types = ["humanoid", "fey"]
unarmed_proficiency = 2
# check -- состязание DMG: бросок атаки против проверки цели;
# save -- спасбросок цели Сил/Лов против СЛ 8 + Сил/Лов + БМ
mode = "check"
# шанс (%) монстра без тега disarmer получить роль обезоруживающего при старте боя, раз за бой
enemy_chance = 0

[defeat]
robbery_gold_percent = 50
left_to_die_hours_dice = "1d8"
left_to_die_hp = 1

[xp]
quest_minor_percent = 10
quest_medium_percent = 25
quest_major_percent = 50

[saves]
autosave_keep = 3

[scene]
max_player_turns = 30
max_time_jump_s = 3600
max_per_chapter = 15

[attitude]
step = 10
per_scene = 30

# новые локации (BACKLOG 170): связи внутри родителя не длиннее inside_max_m метров
[locations]
inside_max_m = 500

# память NPC о герое: сцены с событиями (BACKLOG 79)
[npc_memory]
max_scenes = 20
max_events_per_scene = 5
