# благосклонность богов (ТЗ 4.2)
[favor]
step = 2
per_scene = 3
intervention_percent_9 = 50
intervention_percent_10 = 75
debt_then = "{god} требует от {hero} услугу за спасение от смерти"
servant_cooldown = "30d"

[limits]
give_item_max_qty = 20
max_enemies = 6
# лечебных предметов (расходников), которые можно выдать за сцену
consumables_per_scene = 3
# окно ходов: та же сумма explicit gain повторно отклоняется (0 -- выкл.)
gold_repeat_turns = 3
# наград опыта (award_xp) за сцену; сверх лимита отклоняется (0 -- выкл.)
xp_awards_per_scene = 1
# окно ходов: hour повторно без пути и дела отклоняется (0 -- выкл.)
time_repeat_turns = 2
# кулдаун повторного длинного отдыха от конца предыдущего
long_rest_cooldown = "12h"
# движок сам ждёт до конца кулдауна и проводит длинный отдых, если ждать не дольше
long_rest_wait_max = "8h"

# сюжетные предметы мастера (give_custom_item)
[custom_items]
