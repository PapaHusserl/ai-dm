[time]
round_s = 6
short_rest_s = 3600
long_rest_s = 28800
min_advance_s = 600
# обычный ход без боя и без сдвига часов мастером: движок прибавляет столько секунд
turn_s = 900
morning_hour = 6

# начало частей суток (час): утро, день, вечер, ночь; ночь идёт до утра
[time.day_parts]
morning = 6
day = 12
evening = 18
night = 21

[time.advance_categories]
hour = 3600
day = 86400
week = 604800

[time.travel_pace]
slow = 3200
normal = 4800
fast = 6400

[combat]
max_rounds = 100
improvise_damage_dice = "1d6"
# ступень elevation в футах
fall_step_ft = 10

[parley]
base_dc = 15
friendly_attitude = 30
hostile_attitude = -30
friendly_bonus = 5
hp_half_bonus = 2
hp_quarter_bonus = 5
losses_bonus = 3
leader_down_bonus = 3
overwhelm_bonus = 2
defect_penalty = 5
