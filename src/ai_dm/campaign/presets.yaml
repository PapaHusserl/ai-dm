- id: heroic
  name: Героическое приключение
  codename: Властелин колец
  description: Эпичный размах, дорога и товарищество, надежда сильнее опасности.
  tone:
    mood: героическое приключенческое фэнтези
    violence: реалистично
    horror: умеренно
    romance: намёки
    language: сдержанно
    notes: >-
      Пиши с эпичным размахом: дорога, товарищество, большие цели. Опасность настоящая, но надежда
      сильнее неё. Подвиги и верность замечай и показывай. Уместен лёгкий юмор в разговорах у костра.
- id: grim
  name: Суровый мир
  codename: Ведьмак
  description: Грязь и цена выбора, никто не чист, жёсткие детали и циничные диалоги.
  tone:
    mood: мрачное фэнтези, моральная серость
    violence: жестоко
    horror: сильно
    romance: откровенно
    language: грубо
    notes: >-
      Пиши сурово: грязь, цена выбора, никто не чист до конца. Раны и бой описывай натуралистично,
      без украшательства. Диалоги циничные, люди говорят прямо и грубо. Победа почти всегда чего-то стоит.
- id: romantic
  name: Чувства и интриги
  codename: Сумерки
  description: Напряжение между людьми, недосказанность, отношения важнее боя.
  tone:
    mood: романтическая драма и социальные интриги
    violence: мягко
    horror: умеренно
    romance: чувственно
    language: сдержанно
    notes: >-
      Пиши о напряжении между людьми: взгляды, паузы, недосказанность. Бой редок и быстр, главное
      в сценах разговоры, тайны и выбор сердца. Эмоции героев и собеседников показывай через жесты и детали.
- id: fairytale
  name: Светлая сказка
  codename: Хроники Нарнии
  description: Чудо и ясность, добро и зло различимы, тёплый образный тон.
  tone:
    mood: светлая сказочная история
    violence: мягко
    horror: нет
    romance: нет
    language: сдержанно
    notes: >-
      Пиши тепло и образно: чудо рядом, добро и зло легко различимы. Опасности случаются, но жестокость
      не смакуй. Мир добр к смелым и честным, говорящие звери и волшебство встречаются как обычное дело.
