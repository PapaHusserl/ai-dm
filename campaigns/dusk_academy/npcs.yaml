- id: henry
  name: Генри
  gender: male
  named: true
  key: false
  location_id: null
  motive: Найти старого друга Нокса; быть рядом с Мирой, которую любил всю жизнь, и угождать ей во всём.
  means:
  - ловкий полурослик, бывший плут
  - гимнастические трюки и кулинария
  notes: |-
    Старый приятель Нокса: когда был вынужден уехать на заработки, прибился к его компании и около 20 лет путешествовал с ним на «Бродячей Луне»; теперь команда пришла в Туманную Гавань.
    Полурослик из родной деревни героини (Миры), обожал её всю жизнь. Очень ловкий, бывший плут, обаятельный и очаровательный. Постоянно развлекает Миру: показывает гимнастические трюки, приносит вкусности, очень вкусно готовит; старается угодить ей во всём. Нокса считает другом, но его ревность задевает Генри, и он не уступает.
