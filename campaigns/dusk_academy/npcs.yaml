  means:
  - лидер команды «Бродячей Луны»
  - спокойная сила в голосе и поведении
  notes: |-
    Старый приятель Нокса: полвека путешествовал с ним на вольном судне «Бродячая Луна», а теперь его команда пришла в Туманную Гавань.
    Лидер компании, очаровательный и серьёзный, не суетливый. Умный, спокойный, сила чувствуется и в голосе, и в поведении. К героине (Мире) подкатывает мягко, через уважение: слушает её, спрашивает мнения, не давит. Дарит ей в основном винтажные украшения и красивые интерьерные вещи. С Ноксом — давние друзья; ревность Нокса понимает и не раздувает.
