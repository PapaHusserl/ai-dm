- id: francis
  name: Господин Франциск
  gender: male
  named: true
  key: false
  location_id: null
  motive: Помочь главному герою и стать ему настоящим ментором; скрыть своё тёмное прошлое.
  means:
  - учит выживанию и дикой природе
  - бывший следопыт-охотник на оборотней
  notes: |-
    Только что приплыл с материка паромом, на острове никого не знает.
    Загадочный новый преподаватель в школе, «господин Франциск», у него тёмное прошлое, очень много секретов, но он хороший человек и старается помочь гл герою. Он становится настоящим ментором, хотя его секреты ещё предстоит раскрыть - некоторые враги до сих пор преследуют его за предательство тёмного ордена следопытов-охотников за оборотнями. Он будет учить гл героя выживанию и дикой природе.
    В академию, он пока не знаком с персонажами, в первую очередь он идёт к ректору, магистру Эдит Гримсдоттир.
- id: knox
  name: Нокс Велар
  gender: male
  named: true
  key: false
  location_id: null
  motive: Найти брата Люциана и позвать его в путешествие; быть с героиней и не помешать её отношениям с братом.
  means:
  - ум, начитанность и образованность
  - обаяние шутника и ухажёра
  notes: |-
    Только что приплыл с материка паромом, на острове никого не знает.
    Младший брат близнец Люциана, он поругался с родителями 50 лет назад и с тех пор путешествовал по миру. Очень умный, начитанный, образованный, повидавший мир, обаятельный шутник и очаровательный ухажёр. Любит брата, но с первого взгляда влюбляется в главную героиню. В нём внутренняя борьба - он хочет и быть с ней, и не помешать отношениям с братом. Цель - найти брата и позвать его в путешествие. Родителей избегает всеми силами. Не сноб, больше такой рок-н-ролльный типок, бунтарь, очень смешной, любит подъебать брата и смеётся над его возвышенностью и чопорностью.
    Он просто ищет Люциана в академии.
