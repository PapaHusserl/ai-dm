- id: mainland_ferry
  name: Паром с материка
  motive: Привозить на остров новых людей.
  members:
  - francis
  - knox
  opportunity:
  - id: arrival
    # заглушка: срок и активацию ставит scripts/migrate_dusk_ferry.py (спящий триггер)
    if: {time_after: 0}
    then: "С утренним паромом сошли Господин Франциск (francis) и Нокс Велар (knox). Выполни npc_update francis → location_id academy (первым делом он идёт к ректору, магистру Эдит Гримсдоттир, и ни с кем из героев не знаком) и npc_update knox → location_id academy (ищет в Академии брата Люциана). Затем одна world_notice visible: с материка прибыл паром, на пирс сошли двое приезжих."
    once: true
    state: disabled
- id: pact_keepers
  name: Хранители Договора
  motive: Следить, чтобы Договор Хранителей не нарушался, и напоминать о его цене.
  members:
  - fortune_teller_haven
  opportunity:
  - id: fortune_visit
    # заглушка: срок и активацию ставит scripts/migrate_dusk_pact.py (спящий триггер)
    if: {time_after: 0}
    then: "Тётушка Мирта (fortune_teller_haven) идёт к героине: выполни npc_update fortune_teller_haven → location_id = локация героини (hero.location_id состояния). Затем одна world_notice visible: «Тётушка Мирта, гадалка с Паромного пирса, ищет тебя: говорят, она увидела в воске что-то, что не даёт ей спать»."
    once: true
    state: disabled
  - id: blight_sign
    if: {flag: "pact:together"}
    then: "Пока Мира и Люциан вместе, острову хуже. Одна world_notice visible — одна беда из перечня, ещё не звучавшая недавно: в гавани ночью погасли все фонари, и никто не смог их зажечь до рассвета; рыбацкая лодка не вернулась с утреннего лова, на воде нашли только пустую сеть; Серебровод помутнел и пахнет тиной, студенты-алхимики жалуются на испорченные зелья; туман у Паромного пирса не рассеялся к полудню, и паромщик отказался отходить; вороны над Утёсом кружат и кричат всю ночь, старики говорят — дурной знак; в оранжерее Академии за одну ночь завяли лунные лилии."
    once: false
    cooldown: 1d
    state: active
  - id: calm_sign
    # заглушка: активирует scripts/migrate_dusk_pact.py (в новых мирах флага нет, value: false сработало бы сразу)
    if: {type: flag, name: "pact:together", value: false}
    then: "Мира и Люциан расстались, равновесие возвращается. Одна world_notice visible: «Над островом прояснилось: туман отступил от пирса, фонари в гавани снова горят ровно, а Серебровод к утру стал прозрачным»."
    once: false
    cooldown: 30d
    state: disabled
