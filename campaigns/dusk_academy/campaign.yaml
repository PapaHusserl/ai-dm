    title: "Глава I: Первый туман"
  scene_summary: |-
    Герой — новичок, переведённый в Академию посреди года. Паром из Портовой Мили причаливает к Сумеречному Мысу: идёт мелкий дождь, туман лежит на соснах. На пирсе героя встречает староста первого курса Майя Ольсен с зонтом и картой. Где-то наверху, на холме, светятся окна Академии.
tone:
  mood: 'Романтическое доброе фэнтези: дождливый туманный городок, магическая школа, тайны ночного народа, первая влюблённость, дружба и уютные вечера; вольный хиппово-мирный дух'
  violence: мягко
  horror: нет
  romance: намёки
  language: сдержанно
  hard_limits:
  - жестокость к беззащитным
  - смерть близких героя
  soft_limits:
  - кровь показывать мельком, без натурализма
  - романтика медленная, без пошлости
  notes: |-
    - Тон тёплый и мечтательный: дождь, свечи, книги, взгляды через библиотечный зал
    - Ночной народ и оборотни — не чудовища, а соседи со своими тайнами; конфликты решаются разговором, доверием и смелостью
    - Романтика медленная: неловкость, записки, совместные дежурства; без пошлости
    - Бой — редкость; опасность скорее в тайнах, недоразумениях и старом проклятии
    - Все персонажи — совершеннолетние (18+)
    - Дух мира вольный, хиппово-беззаботный: любовь и влечение — радость и свобода, без агрессии, насилия, давления и собственничества
    - Флирт взаимный: героиня сама зовёт, дразнит и выбирает; нет «главы семьи» и мужчины-решалы, решения принимают вместе, на равных
    - Многолюбие и свободные союзы — норма, окружающие принимают их спокойно и без осуждения
    - Ревность — обычное чувство, его говорят вслух спокойно («мне немного ревниво, обнимешь?»); без срывов, ссор, вызовов и запретов
