- id: copper_kettle
  name: Трактир «Медный котёл»
  description: Тёплый зал с длинными столами и камином, за стойкой дымится котёл; наверху сдаются комнаты разного достатка; во дворе дымится банька при трактире.
  tags:
  - таверна
  connections:
  - to: wayside_temple
    distance_m: 60
  - to: barber_shop
    distance_m: 40
  - to: forest_edge
    distance_m: 400
- id: wayside_temple
  name: Придорожный храм
  description: Небольшой каменный храм с приделом для больных; на алтаре горят свечи, пахнет воском и травами.
  tags:
  - храм
  connections:
  - to: copper_kettle
    distance_m: 60
- id: barber_shop
  name: Цирюльня
  description: Тесная лавка с зеркалом, тазами и пучками сушёных трав на балках.
  tags:
  - цирюльня
  connections:
  - to: copper_kettle
    distance_m: 40
- id: forest_edge
  name: Опушка леса
  description: Тихая опушка у дороги, поваленное дерево, кострище, дальше стена деревьев. Ни жилья, ни людей.
  tags:
  - лес
  connections:
  - to: copper_kettle
    distance_m: 400
  - to: cursed_chapel
    distance_m: 150
- id: cursed_chapel
  name: Заброшенная часовня
  description: >-
    Покосившаяся часовня в зарослях; на треснувшем алтаре лежит чёрный от времени костяной оберег, от которого веет холодом. Оберег проклят (тест проклятия, У0): если герой касается его или забирает, мастер просит спасбросок Мудрости, и при провале накладывает проклятие инструментом curse; успех — оберег лишь холодит пальцы. Храмовая жрица снимает такое проклятие за плату.
  tags:
  - руины
  connections:
  - to: forest_edge
    distance_m: 150
