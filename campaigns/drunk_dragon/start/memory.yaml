game_summary: 'Осенней ночью следопыт Грей прячется от ливня в таверне «Пьяный Дракон» и по просьбе одноглазого трактирщика-полуорка спускается в подвал, где убивает троглодита и спасает помощника Мило. На твари — клеймо в виде перевёрнутого замочного клина с тремя каплями крови, такая же татуировка была у незнакомца в балахоне. След ведёт в Старую башню: там Грей срывает ритуал вскрытия древнего фолианта и убивает культистов. Жрец Латандра отец Марк опознаёт Орден Разбитого Ключа, запечатывает ларец с фолиантом «Ключи Бездны» и прячет его в храме. По записке культистов Грей идёт на север к Аббатству Алого Тумана. В деревне Чернолесье он помогает старому охотнику Ольгерду: убивает вожака болотных гончих Кровозуба, возвращает отцу медальон и дневник погибшего сына Итана и получает тяжёлый арбалет «Загонщик». В Аббатстве Грей в одиночку убивает Верховного Иерарха и забирает два ритуальных кристалла. Из бумаг он узнаёт о трёх ключах к Вратам, Втором Святилище в Чёрных Топях и городском покровителе культа — Советнике Варене. Затем он громит обоз культа на Гадючьем Острове, забирает третий кристалл, вербует пленника Эрика и зачищает Мёртвый Курган, где хранился архив, которым культ шантажировал Варена. Эрик выманивает Варена в ловушку у Смолокурни. Варен выдаёт сообщников — Казначея Ольбрехта и Смотрителя Шлюзов Хорста. Грей убивает Хорста за минуты до отравления городской воды «слезой Бездонного Мора». Он забирает 500 крон из тайника Варена и передаёт заговорщиков и улики Капитану Стражи; Ольбрехта арестовывают. Глава II. Утром Грей получает письмо Брана Седогрива, мастера опальной Ложи Северного Ветра. Бран объясняет: кристаллы — Ключи Погребения к Древнему Могильнику Мор-Владыки под Железным Кряжем. В этот момент культисты нападают на Ратушу и освобождают Ольбрехта. Грей спасает Мило, которого защитил лунный купол амулета Селунэ, убивает и обезглавливает Ольбрехта и Клинком Северного Ветра разбивает все три кристалла, а Бран убивает мутанта-тюремщика. В портфеле Ольбрехта находят записку Верховного Жреца Назира: тот ждёт в Кузнице Пепла, крепости гномов в жерле потухшего вулкана. Поскольку ключей больше нет, Назир попытается вскрыть Могильник массовой кровавой жертвой. На военном совете Грей предлагает план «Щит и Клинок»: Капитан с ополчением прикрывает деревни предгорий, а малый отряд — Грей, Бран, звероловы-егеря Йорген и полуэльфийка Лира — идёт снять Назира. Грей тратит почти всё золото на мифриловую рубаху, тёплый плащ, особые стрелы и зелья. У ручья Чёрный Исток отряд бесшумно уничтожает орков-работорговцев и берёт живым аколита Эдрина. Эдрин описывает гарнизон и ярусы Кузницы и рассказывает о плохо заложенной Восточной шахте. Белая сова Селунэ и спрятанный медальон с символом богини убеждают Грея оставить решение Эдрину, и тот добровольно становится проводником. Около полуночи отряд из пяти человек стоит у подножия Кряжа в двух часах подъёма от Восточной шахты; ритуал Назира должен начаться на рассвете.'
chapters:
- id: ch_1
  number: 1
  title: 'Глава I: Тайна таверны «Пьяный Дракон»'
  summary: Следопыт Грей укрывается от ливня в таверне «Пьяный Дракон» и спасает из подвала помощника трактирщика Мило, убив троглодита с клеймом культа. След ведёт к Старой башне, где Грей срывает ритуал Ордена Разбитого Ключа и забирает ларец с фолиантом «Ключи Бездны», который оставляет под печатью у жреца Латандра отца Марка. В Чернолесье он помогает Ольгерду, убивает вожака гончих Кровозуба и находит останки и дневник Итана. В Аббатстве Алого Тумана Грей убивает Верховного Иерарха, забирает два кристалла и узнаёт о Втором Святилище и городском покровителе Варене. Затем он громит заслон на Гадючьем Острове, забирает третий кристалл, вербует пленника Эрика и зачищает Мёртвый Курган с архивом Варена. С помощью Эрика он выманивает и берёт в плен Варена, предотвращает отравление воды, убив смотрителя Хорста. Забрав 500 крон из тайника Варена, Грей сдаёт заговорщиков Капитану Стражи; Казначея Ольбрехта арестовывают.
- id: ch_2
  number: 2
  title: 'Глава II: Отголоски Мора'
  summary: 'После отдыха в «Пьяном Драконе» Грей получает письмо Ложи Северного Ветра и встречается с её мастером Браном Седогривом в лавке «Сухой Вереск». Бран объясняет, что кристаллы — Ключи Погребения к Могильнику Мор-Владыки под Железным Кряжем. Набат: культисты нападают на Ратушу; Грей спасает Мило, укрытого лунным куполом амулета Селунэ, сжигает стрелой и обезглавливает освобождённого Ольбрехта и разбивает все три кристалла Клинком Северного Ветра. В портфеле Ольбрехта находят план экспедиции и записку Верховного Жреца Назира о Кузнице Пепла. На военном совете принят план «Щит и Клинок»: Капитан защищает деревни, а Грей с Браном, Йоргеном и Лирой идёт к Назиру. Грей тратит почти всё золото на мифрил, стрелы и зелья. У ручья Чёрный Исток отряд уничтожает рейдеров-орков и берёт живым аколита Эдрина, который выдаёт устройство Кузницы. Знамение Селунэ (белая сова) и тайный медальон Эдрина приводят к тому, что Эдрин сам вызывается быть проводником к Восточной шахте.'
scenes:
- id: sc_1
  chapter_id: ch_1
  title: Крик из подвала
  summary: Ливень, таверна «Пьяный Дракон»; трактирщик-полуорк нанимает Грея за 15 зм найти пропавшего Мило.
- id: sc_2
  chapter_id: ch_1
  title: Троглодит в погребе
  summary: Грей ослепляет тварь факелом и убивает мечом, перевязывает Мило; находит амулет Селунэ и клеймо культа.
- id: sc_3
  chapter_id: ch_1
  title: Улики и баррикада
  summary: Мило описывает знак перевёрнутого замка у незнакомца в балахоне; Грей обыскивает тушу (свисток, агат) и заваливает пролом.
- id: sc_4
  chapter_id: ch_1
  title: Ритуал в Старой башне
  summary: Грей мимо псов проникает в склеп, слушает ритуал на языке Бездны и стрелой срывает вскрытие печати фолианта.
- id: sc_5
  chapter_id: ch_1
  title: Бой на крыше башни
  summary: Второй сектант убит, главный культист заколот и падает с башни, освободившийся троглодит обезглавлен; найдена записка про Аббатство Алого Тумана.
- id: sc_6
  chapter_id: ch_1
  title: Отец Марк
  summary: Жрец Латандра опознаёт Орден Разбитого Ключа, ставит Освящённую Печать на ларец и прячет его под алтарём, благословляет оружие Грея.
- id: sc_7
  chapter_id: ch_1
  title: Покупки у Хэка
  summary: Грей закупает стрелы, противоядия, верёвку, болотоступы, шест и карту болот; трактирщик даёт паёк.
- id: sc_8
  chapter_id: ch_1
  title: Чернолесье и Тобин
  summary: Подслушав охотников, Грей берёт у старосты Тобина заказ на вожака гончих за 30 зм.
- id: sc_9
  chapter_id: ch_1
  title: Ольгерд
  summary: Хитростью разговорив сломленного охотника, Грей получает карту троп, гарпунные дротики и арбалет «Загонщик».
- id: sc_10
  chapter_id: ch_1
  title: Бой у Старой Гати
  summary: Болт в загривок, огненная стена из камышей и бронебойная стрела в пасть убивают Кровозуба; найдены останки, медальон и дневник Итана.
- id: sc_11
  chapter_id: ch_1
  title: Возвращение в Чернолесье
  summary: Ольгерд получает вещи сына и дарит «Загонщик»; Тобин платит 30 зм; Брон укрепляет куртку и делает костяные наконечники.
- id: sc_12
  chapter_id: ch_1
  title: Крипта Аббатства
  summary: Через водосток и с балкона Грей сжигает ритуалиста и убивает двух фанатиков, забирает шкатулку и ключ.
- id: sc_13
  chapter_id: ch_1
  title: Смерть Верховного Иерарха
  summary: Выстрел в Кристалл Фокуса снимает щит, стрела в сердце убивает Иерарха; Грей из тумана валит двух осквернённых стражей.
- id: sc_14
  chapter_id: ch_1
  title: Покои Иерарха
  summary: Дневник, карта, письмо Магистру Второго Круга, зелёный «Ключ Топей»; узнаёт о трёх ключах и Втором Святилище.
- id: sc_15
  chapter_id: ch_1
  title: Тайник и подслушанный гарнизон
  summary: 'Из укрытия Грей узнаёт: до новолуния три дня, культ уходит к Северным Топям, Магистрат задерживает стражу.'
- id: sc_16
  chapter_id: ch_1
  title: Допрос в оружейной
  summary: Караульный выдаёт маршрут через Старый Волок и имя покровителя — Советник Варен.
- id: sc_17
  chapter_id: ch_1
  title: Засада во дворе
  summary: С надвратной галереи Грей убивает капитана и следопыта гарнизона, взрывает телегу с реагентами; остатки бегут.
- id: sc_18
  chapter_id: ch_1
  title: Смолокурня
  summary: 'Грей снимает двух наёмников и допрашивает старшего: заслон на Гадючьем Острове и пароль свистка.'
- id: sc_19
  chapter_id: ch_1
  title: Гадючий Остров
  summary: По паролю ослабив бдительность, Грей убивает чернокнижника, арбалетчиков, Второго Иерарха и пехоту; берёт синий кристалл и пленника.
- id: sc_20
  chapter_id: ch_1
  title: Письмо Варена
  summary: Грей читает угрозу Варена отравить воду «слезой Бездонного Мора» и вербует пленника Эрика.
- id: sc_21
  chapter_id: ch_1
  title: Мёртвый Курган
  summary: Через затопленный лаз Грей убивает Третьего Иерарха и пятерых храмовников, забирает архив Варена и противоядие.
- id: sc_22
  chapter_id: ch_1
  title: Ловушка для Варена
  summary: Эрик выманивает Варена к Смолокурне; Грей перебивает охрану, оглушает и допрашивает Варена — имена Ольбрехта и Хорста.
- id: sc_23
  chapter_id: ch_1
  title: Шлюзы
  summary: Грей убивает Хорста и охрану, демонтирует колбу с ядом и запирает шлюзы.
- id: sc_24
  chapter_id: ch_1
  title: Триумф у Ратуши
  summary: Забрав 500 крон из тайника Варена, Грей сдаёт доказательства Капитану; Ольбрехта арестовывают.
- id: sc_25
  chapter_id: ch_2
  title: Утро и письмо Ложи
  summary: Отдых в таверне; трактирщик (Грок) отдаёт 15 зм; под дверью письмо Брана Седогрива; Мило рассказывает о светившемся амулете.
- id: sc_26
  chapter_id: ch_2
  title: «Сухой Вереск»
  summary: Бран рассказывает о Ключах Погребения и Мор-Владыке, предлагает Клинок Северного Ветра; проверка Проницательности подтверждает его честность.
- id: sc_27
  chapter_id: ch_2
  title: Набат над Ратушей
  summary: Культисты взрывают ворота Ратуши; Грей двумя стрелами убивает палача, угрожавшего Мило под лунным куполом.
- id: sc_28
  chapter_id: ch_2
  title: Казнь Ольбрехта
  summary: Бран уводит мутанта-тюремщика; Грей поджигает бегущего Ольбрехта, обезглавливает его и раскалывает Алый Кристалл.
- id: sc_29
  chapter_id: ch_2
  title: Обыск и уничтожение ключей
  summary: На теле Ольбрехта 350 крон, мастер-ключ, перстень, антидот; Грей разбивает зелёный и синий кристаллы; найдена записка Назира.
- id: sc_30
  chapter_id: ch_2
  title: Военный совет
  summary: 'Грей объединяет идеи Капитана и Брана в план «Щит и Клинок»: заслон у деревень и малый авангард к Кузнице Пепла.'
- id: sc_31
  chapter_id: ch_2
  title: Снаряжение похода
  summary: Грей покупает мифрил, плащ «Снежный Призрак», зелья, альпинистский набор; знакомится с Йоргеном и Лирой; остаётся 54 кроны.
- id: sc_32
  chapter_id: ch_2
  title: Выезд на Кряж
  summary: Бран описывает три маршрута; через 2 часа Лира замечает стоянку орков у ручья Чёрный Исток.
- id: sc_33
  chapter_id: ch_2
  title: Засада у Чёрного Истока
  summary: Грей бесшумно убивает часового; залп, Бран и Йорген добивают орков, аколит схвачен без тревоги.
- id: sc_34
  chapter_id: ch_2
  title: Допрос Эдрина
  summary: Грей казнит оглушённого орка; сломленный Эдрин раскрывает гарнизон, ярусы Кузницы и путь через Восточную шахту.
- id: sc_35
  chapter_id: ch_2
  title: Знамение Селунэ
  summary: Белая сова смотрит на Эдрина; у него обнаруживается тайный медальон Селунэ.
- id: sc_36
  chapter_id: ch_2
  title: Выбор Эдрина
  summary: Эдрин добровольно становится проводником; отряд из пяти уходит к Восточной шахте, до смены часовых около 1 ч 20 мин.
