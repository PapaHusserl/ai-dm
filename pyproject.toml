[project]
name = "ai-dm"
version = "0.1.0"
description = "AI-DM: движок правил D&D 5.5e (SRD 5.2) с ИИ-мастером"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "google-genai>=2.28.0",
    "pydantic>=2",
    "pyyaml",
    "textual>=8.2",
]

[project.optional-dependencies]
audio = ["miniaudio>=1.60"]

[project.scripts]
ai-dm = "ai_dm.ui.cli:main"

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src", "tests",
    "tests/unit/campaign", "tests/unit/rules", "tests/unit/reports", "tests/unit/ui",
    "tests/unit/llm", "tests/unit/combat", "tests/unit/world_sim", "tests/unit/protocol",
    "tests/unit/game", "tests/unit/audio", "tests/unit/master", "tests/unit/persistence",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ai_dm"]

[tool.coverage.run]
source = ["ai_dm"]
branch = true

[tool.coverage.report]
fail_under = 94
show_missing = true
skip_covered = true

[tool.vulture]
paths = ["src", "devtools", "vulture_allowlist.py"]
min_confidence = 60
ignore_names = ["model_config"]
ignore_decorators = ["@field_validator", "@model_validator"]

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["campaigns/", "content/", "devtools/", "pyproject.toml"]
